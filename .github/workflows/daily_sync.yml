name: Daily Index Sync

on:
  schedule:
    - cron: '30 8 * * *'  # 台北時間 16:30 (台股)
    - cron: '30 21 * * *' # 台北時間 05:30 (那指)
  workflow_dispatch:      # 允許手動觸發

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install yfinance pandas numpy supabase requests

      - name: Run sync script
        env:
          SUPABASE_URL: "https://nnoazshcucwjlccjqtkl.supabase.co"
          SUPABASE_SERVICE_ROLE_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5ub2F6c2hjdWN3amxjY2pxdGtsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY3MDgzNzYsImV4cCI6MjA5MjI4NDM3Nn0.FE-onwhqZNBWWdUBoqD1lR-n5So9PbQ9BvjB9pWCz6g"
        run: |
          python scripts/sync_to_supabase.py
          python scripts/update_taiwan_momentum_daily.py

      - name: Commit & Push updated JSON
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/taiwan_momentum_30.json
          if ! git diff --cached --quiet; then
            git commit -m "data: Auto-update Taiwan Momentum 30 daily NAV"
            git push origin main
          else
            echo "No changes to commit, skipping push."
          fi

      - name: Send Daily Report Email
        if: always()
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -X POST https://index-terminal.vercel.app/api/send-report \
          -H "Content-Type: application/json" \
          -d "{\"secret\": \"$CRON_SECRET\"}"
